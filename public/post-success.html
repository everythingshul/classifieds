<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Successful</title>
<link rel="icon" type="image/png" href="/img/logo.png">
<link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
<link rel="stylesheet" href="/css/main.css">
</head>
<body>
<div class="container" style="padding:80px 0;text-align:center;max-width:560px" id="content">
  <h1>Finishing up…</h1>
  <p>Please wait a moment while we confirm your payment.</p>
</div>
<script>
(function () {
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  function render(html) {
    document.getElementById('content').innerHTML = html;
  }

  function postUrl(post) {
    const segment = post.type === 'simcha' ? 'simchas' : post.type === 'listing' ? 'listings' : 'classifieds';
    return `/${segment}/${post.id}`;
  }

  async function verify(sessionId, attempt) {
    const res = await fetch(`/api/posts/verify-session?session_id=${encodeURIComponent(sessionId)}`);
    const data = await res.json();

    if (!data.paid) {
      // Stripe sometimes finishes confirming a moment after the redirect - retry briefly.
      if (attempt < 5) return setTimeout(() => verify(sessionId, attempt + 1), 1500);
      render(`
        <h1>Payment Pending</h1>
        <p>We haven't confirmed your payment yet. If you completed checkout, this can take a minute - refresh this page shortly, or check your email for a confirmation.</p>
        <p><a class="btn" href="/">Return to Home</a></p>
      `);
      return;
    }

    if (data.kind === 'boost') {
      render(`
        <h1>Payment Successful</h1>
        <p>Your listing has been boosted to the top.</p>
        <p><a class="btn" href="${data.post ? postUrl(data.post) : '/'}">View your listing</a></p>
      `);
    } else if (data.kind === 'strike') {
      render(`
        <h1>Payment Successful</h1>
        <p>Your listing is now featured.</p>
        <p><a class="btn" href="${data.post ? postUrl(data.post) : '/'}">View your listing</a></p>
      `);
    } else if (data.post && data.post.status === 'pending_approval') {
      render(`
        <h1>Your post has been submitted!</h1>
        <p>Thank you! Your payment has been received and an invoice was emailed to you. Since it includes photos, it needs a quick admin review before it goes live - usually within a day.</p>
        <p><a class="btn btn-outline" href="/">Back to Home</a></p>
      `);
    } else if (data.post) {
      render(`
        <h1>Your post is live!</h1>
        <p>Thank you! Your payment has been received and an invoice was emailed to you.</p>
        <p><a class="btn" href="${postUrl(data.post)}">View your post</a></p>
      `);
    } else {
      render(`
        <h1>Payment Successful</h1>
        <p>Thank you! Your payment has been received. If your post included photos, it will go live once approved by our team.</p>
        <p><a class="btn" href="/">Return to Home</a></p>
      `);
    }
  }

  const sessionId = new URLSearchParams(window.location.search).get('session_id');
  if (!sessionId) {
    render(`<h1>Payment Successful</h1><p>Thank you!</p><p><a class="btn" href="/">Return to Home</a></p>`);
  } else {
    verify(sessionId, 0).catch(() => {
      render(`
        <h1>Payment Successful</h1>
        <p>Thank you! Your payment has been received and your post is being finalized. You'll receive an email confirmation shortly.</p>
        <p><a class="btn" href="/">Return to Home</a></p>
      `);
    });
  }
})();
</script>
</body>
</html>
